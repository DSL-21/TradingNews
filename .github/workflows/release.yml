name: Publish Trading News GitHub Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type RELEASE to confirm publishing the signed Android APK"
        required: true
        type: string
      release_notes:
        description: "Short release summary"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: trading-news-release
  cancel-in-progress: false

jobs:
  publish:
    name: Test, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Validate release confirmation and source branch
        env:
          CONFIRM_RELEASE: ${{ github.event.inputs.confirm_release }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RELEASE" != "RELEASE" ]]; then
            echo "::error::Enter RELEASE exactly to confirm publishing."
            exit 1
          fi
          if [[ "$GH_REF" != "refs/heads/main" ]]; then
            echo "::error::Production releases must be created from main."
            exit 1
          fi
          if [[ -z "$RELEASE_NOTES" ]]; then
            echo "::error::Release notes must not be empty."
            exit 1
          fi

      - name: Checkout selected source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require public repository and signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Android signing secret is missing: $name"
              exit 1
            fi
          done
          VISIBILITY="$(gh api "repos/$GH_REPO" --jq '.visibility')"
          if [[ "$VISIBILITY" != "public" ]]; then
            echo "::error::Repository must be Public before publishing a public portfolio release."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'

      - name: Read app version and refuse to overwrite a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(awk -F'"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)"
          VERSION_CODE="$(awk -F'= ' '/versionCode =/ { print $2; exit }' app/build.gradle.kts)"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Android version metadata."
            exit 1
          fi
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release or Git tag $TAG already exists. Increment versionName and versionCode."
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/trading-news-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run unit tests and Android lint
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:lintRelease

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify signed APK identity and integrity
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_NORMALIZED="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$ACTUAL_NORMALIZED" || "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]]; then
            echo "::error::Unexpected Android release signing certificate."
            exit 1
          fi
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.tradingnews.app'" apk-badging.txt
          grep -q "versionName='$VERSION_NAME'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt
          echo "sha256=$(cut -d ' ' -f 1 apk-sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            printf '# Trading News %s\\n\\n' "$RELEASE_VERSION"
            printf '%s\\n\\n' "$RELEASE_NOTES"
            printf '%s\\n' \\
              '## Included functionality' \\
              '- Live GDELT DOC 2.0 market and global-news headline discovery.' \\
              '- Topic filters and a locally stored instrument watchlist.' \\
              '- Live, cached, offline and connecting feed states.' \\
              '- Optional best-effort WorkManager refresh and local Android notifications.' \\
              '- Direct links to original publishers and the official Forex Factory calendar.' \\
              '' \\
              '## Data limitations' \\
              '- Instrument matches are keyword relevance hints, not trading signals.' \\
              '- Forex Factory calendar exports remain hosted by the original publisher; this app does not copy or redistribute FEED data.' \\
              '- No broker or price feed is connected; instrument matches are keyword relevance hints, not measured price impact or trading signals.' \\
              '' \\
              '## Integrity' \\
              "- Source commit: $SOURCE_SHA" \\
              "- APK SHA-256: $APK_SHA256" \\
              '- Signed Android APK for direct installation; not a Google Play listing.'
          } > release-notes.md
          gh release create "$RELEASE_TAG" "app/build/outputs/apk/release/app-release.apk#TradingNews-v$RELEASE_VERSION.apk" \
            --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Trading News $RELEASE_VERSION" \
            --notes-file release-notes.md

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" && -f "$ANDROID_KEYSTORE_PATH" ]]; then
            shred -u "$ANDROID_KEYSTORE_PATH" || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
