name: Publish Trading News GitHub Release

on:
  workflow_run:
    workflows: ["Build Trading News APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  check-signing:
    name: Check release signing is configured
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      signing_ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required repository secrets
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$FC_API_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release is waiting for the four Android signing secrets and FC_API_KEY."
            exit 0
          fi
          VISIBILITY="$(gh api "repos/$GH_REPO" --jq '.visibility')"
          if [[ "$VISIBILITY" != "public" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed public releases require this repository to be Public. Change visibility in GitHub Settings after reviewing repository history."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Signing secrets, calendar key, and public repository visibility are configured."

  publish:
    name: Test, sign, and publish APK
    needs: check-signing
    if: ${{ needs.check-signing.outputs.signing_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'

      - name: Read app version and create release tag
        id: version
        run: |
          VERSION_NAME="$(awk -F'"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)"
          VERSION_CODE="$(awk -F'= ' '/versionCode =/ { print $2; exit }' app/build.gradle.kts)"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read Android version metadata."
            exit 1
          fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "versionName must use MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Increment versionName and versionCode before the next app change."
            exit 1
          fi

      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/trading-news-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate current licensed calendar snapshot
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          payload = json.loads(Path("data/economic-calendar.json").read_text(encoding="utf-8"))
          attribution = payload.get("attribution") or {}
          usage = payload.get("free_developer") or {}
          required_attribution = ("source", "url", "terms")
          if any(not isinstance(attribution.get(key), str) or not attribution[key].strip() for key in required_attribution):
              raise SystemExit("Calendar snapshot is missing mandatory Free Developer attribution.")
          if not isinstance(usage, dict) or not usage.get("plan"):
              raise SystemExit("Calendar snapshot is missing the live Free Developer quota object.")
          fetched = dt.datetime.fromisoformat(payload["fetched_at"].replace("Z", "+00:00"))
          age = dt.datetime.now(dt.timezone.utc) - fetched
          if age.total_seconds() < 0 or age > dt.timedelta(hours=36):
              raise SystemExit("Calendar snapshot is stale; run Update licensed economic calendar before release.")
          events = payload.get("events")
          if not isinstance(events, list) or len(events) > 60:
              raise SystemExit("Calendar snapshot is missing or exceeds the configured three-response limit.")
          print(f"Verified {len(events)} attributed schedule events; daily quota {usage.get('used_today')}/{usage.get('daily_limit')}; monthly quota {usage.get('used_this_month')}/{usage.get('monthly_limit')}.")
          PY

      - name: Run unit tests and Android lint
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:lintRelease

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify signed APK, package, and version
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.tradingnews.app'" apk-badging.txt
          grep -q "versionName='$VERSION_NAME'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt
          echo "sha256=$(cut -d ' ' -f 1 apk-sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TradingNews-v${{ steps.version.outputs.version }}-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create standard GitHub Release and attach signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # Trading News $RELEASE_VERSION

          A signed Android release built from commit $SOURCE_SHA.

          ## Included
          - Live GDELT DOC 2.0 market and global-news headline discovery.
          - Topic filters and a locally stored, user-configurable instrument watchlist.
          - Explicit LIVE, CACHED, OFFLINE, and CONNECTING feed states.
          - Best-effort background refresh and optional local Android headline notifications.
          - Native Finance Calendar Free Developer schedule snapshot with event-time precision, High/Medium/Low filters, original publisher links/credits, truncation notices and quota status.
          - Official Forex Factory calendar link (no scraping or redistribution of its FEED data).
          - Bounded HTTPS requests, URL validation, parser limits, and local cache controls.

          ## Data limitations
          - Forex Factory event data remains on the official website; this app does not scrape or redistribute the calendar.
          - Instrument matches are keyword relevance hints, not market impact ratings or trading signals.
          - Free Developer schedule responses do not include forecast, prior or actual figures.
          - No post-event price reaction is displayed because a licensed price-history source is not configured.

          ## Integrity
          APK SHA-256: $APK_SHA256

          This release is signed with the repository's persistent Android release key. It is an installable GitHub release, not a Google Play listing. Device QA and an external security review are still recommended before wider distribution.
          EOF

          APK="app/build/outputs/apk/release/app-release.apk"
          gh release create "$RELEASE_TAG" "$APK#TradingNews-v$RELEASE_VERSION.apk" --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Trading News $RELEASE_VERSION" --notes-file release-notes.md

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" && -f "$ANDROID_KEYSTORE_PATH" ]]; then
            shred -u "$ANDROID_KEYSTORE_PATH" || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
