name: Release Trading News

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Standard release tag (vMAJOR.MINOR.PATCH)"
        required: true
        default: "v0.2.0"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  test-build-publish:
    name: Test, build, verify, and publish standard GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate standard release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag || 'v0.2.0' }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only standard vMAJOR.MINOR.PATCH tags are accepted. Pre-release tags are not allowed."
            exit 1
          fi
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Verify source contains no sample feeds
        run: |
          if grep -RniE 'DemoData|sampleHeadline|mockNews|fakeEvent' app/src/main; then
            echo "Unexpected sample/demo market data found"
            exit 1
          fi

      - name: Run unit tests and Android lint
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:lintRelease

      - name: Build debug and release variants
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APK signature and package metadata
        id: apk
        env:
          VERSION_NAME: ${{ steps.release.outputs.version }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "versionName='$VERSION_NAME-debug'" apk-badging.txt
          grep -q "package: name='com.tradingnews.app.debug'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt
          echo "sha256=$(cut -d ' ' -f 1 apk-sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TradingNews-${{ steps.release.outputs.version }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare standard release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          cat > release-notes.md <<EOF
          # Trading News $RELEASE_VERSION

          This is a **standard GitHub Release** (not a pre-release) for the private Trading News repository.

          ## Included
          - English-language Android app with dark UI.
          - Live GDELT DOC 2.0 headline discovery, topic filters, and original publisher links.
          - Explicit LIVE / CACHED / OFFLINE feed states.
          - Bounded parser and response sizes, HTTPS-only external article links, and a cache expiry limit.
          - No demo headlines or fabricated economic events.

          ## Important build status
          The attached APK is the **debug variant**, signed with the temporary Android debug certificate created by this GitHub Actions runner. It is suitable for installation and functional testing, but it is **not a production-signed Google Play package** and should not be treated as the final public-store build. A persistent private signing key must be configured as protected GitHub Actions secrets before a production release.

          APK SHA-256: `$APK_SHA256`

          ## Economic calendar
          The Calendar tab opens the official Forex Factory calendar in the browser. Native in-app copying or redistribution of its calendar data is not included because written permission has not been obtained.

          ## Verification
          This workflow ran parser unit tests, Android lint for debug and release, built both variants, and verified the APK signature and package metadata. This does not replace device QA, a penetration test, or an external security review.
          EOF

      - name: Refuse to overwrite an existing standard release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Use a new version tag instead of overwriting a published release."
            exit 1
          fi

      - name: Publish standard GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET="TradingNews-v$RELEASE_VERSION-debug.apk"

          gh release create "$RELEASE_TAG" "$APK#$ASSET" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "Trading News $RELEASE_VERSION" \
            --notes-file release-notes.md

      - name: Remove superseded beta pre-release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v0.2.0-beta.1" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "v0.2.0-beta.1" --cleanup-tag --yes --repo "$GH_REPO"
          fi

      - name: Verify published release is not a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")"
          echo "$RELEASE_JSON" | jq -e '.draft == false and .prerelease == false' >/dev/null
          echo "$RELEASE_JSON" | jq -r '"Published: " + .html_url'
          echo "$RELEASE_JSON" | jq -r '.assets[] | "Asset: " + .name + " (" + (.size|tostring) + " bytes)"'
