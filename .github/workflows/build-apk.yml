name: Build Trading News APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TradingNews-GitHub-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract application source
        run: |
          mkdir -p .source
          unzip -q TradingNews-GitHub-Source.zip -d .source
          rsync -a --exclude='.github/' --exclude='README.md' .source/ ./
          rm -rf .source

      - name: Fix Compose weight import
        run: |
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' app/src/main/java/com/tradingnews/app/MainActivity.kt
          if grep -q '^import androidx\.compose\.foundation\.layout\.weight$' app/src/main/java/com/tradingnews/app/MainActivity.kt; then
            echo "Invalid Compose weight import is still present"
            exit 1
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingNews-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
