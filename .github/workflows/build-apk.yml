name: Build Trading News APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TradingNews-v0.2.0-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Trading News 0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract v0.2.0 source project
        run: |
          mkdir -p .source
          unzip -q TradingNews-v0.2.0-source.zip -d .source
          test -f .source/TradingNews-v0.2.0/settings.gradle.kts
          rsync -a .source/TradingNews-v0.2.0/ ./
          rm -rf .source

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and Android lint
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingNews-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
