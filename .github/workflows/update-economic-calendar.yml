name: Update licensed economic calendar

on:
  schedule:
    # Three country-group requests once per UTC day (about 90/month).
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-calendar-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test snapshot aggregation
        working-directory: scripts
        run: python -m unittest -v test_refresh_calendar.py

      - name: Check calendar API credential
        id: credential
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
        run: |
          if [[ -z "$FC_API_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Native calendar refresh is waiting for the FC_API_KEY repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and merge licensed calendar data
        if: steps.credential.outputs.configured == 'true'
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
        run: python scripts/refresh_calendar.py

      - name: Publish updated snapshot to the repository
        if: steps.credential.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- data/economic-calendar.json; then
            echo "Calendar snapshot did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic-calendar.json
          git commit -m "chore(calendar): refresh licensed economic events"
          git push
