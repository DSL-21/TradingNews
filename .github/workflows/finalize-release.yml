name: Finalize Trading News Release Metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-release.yml'

permissions:
  contents: write

jobs:
  finalize:
    name: Verify and normalize v0.2.0 release asset
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing standard release and download its APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.2.0"
          EXPECTED_DIGEST="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "app-debug.apk") | .digest')"
          if [[ -z "$EXPECTED_DIGEST" ]]; then
            echo "Expected existing app-debug.apk release asset was not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/trading-news-release"
          gh release download "$TAG" --pattern "app-debug.apk" --dir "$RUNNER_TEMP/trading-news-release"

          SOURCE="$RUNNER_TEMP/trading-news-release/app-debug.apk"
          test -s "$SOURCE"
          ACTUAL_DIGEST="sha256:$(sha256sum "$SOURCE" | cut -d ' ' -f 1)"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Downloaded APK digest does not match GitHub's release asset digest."
            exit 1
          fi

          ASSET="$RUNNER_TEMP/trading-news-release/TradingNews-v0.2.0-debug.apk"
          mv "$SOURCE" "$ASSET"
          echo "APK_SHA256=${ACTUAL_DIGEST#sha256:}" >> "$GITHUB_ENV"
          echo "APK_ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Replace generic asset name and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.2.0"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Trading News 0.2.0

          This is a **standard GitHub Release** (not a pre-release) for the private Trading News repository.

          ## Included
          - English-language Android app with dark UI.
          - Live GDELT DOC 2.0 headline discovery, topic filters, and original publisher links.
          - Explicit LIVE / CACHED / OFFLINE feed states.
          - Bounded parser and response sizes, HTTPS-only external article links, and a cache expiry limit.
          - No demo headlines or fabricated economic events.

          ## Important build status
          The attached APK is the **debug variant**, signed with the temporary Android debug certificate created by the GitHub Actions runner. It is suitable for installation and functional testing, but it is **not a production-signed Google Play package**. A persistent private signing key must be configured as protected GitHub Actions secrets before public-store distribution.

          APK SHA-256: $APK_SHA256

          ## Economic calendar
          The Calendar tab opens the official Forex Factory calendar in the browser. Native in-app copying or redistribution of its calendar data is not included because written permission has not been obtained.

          ## Verification
          The release workflow ran parser unit tests, Android lint for debug and release, built both variants, and verified the APK signature and package metadata. This does not replace device QA, a penetration test, or an external security review.
          EOF

          gh release delete-asset "$TAG" "app-debug.apk" --yes --repo "$GH_REPO"
          gh release upload "$TAG" "$APK_ASSET" --repo "$GH_REPO"
          gh release edit "$TAG" --title "Trading News 0.2.0" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GH_REPO"

      - name: Verify release metadata and renamed asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/tags/v0.2.0")"
          echo "$RELEASE_JSON" | jq -e '.draft == false and .prerelease == false' >/dev/null
          echo "$RELEASE_JSON" | jq -e '[.assets[].name] | index("TradingNews-v0.2.0-debug.apk") != null' >/dev/null
          echo "$RELEASE_JSON" | jq -r '"Release: " + .html_url'
          echo "$RELEASE_JSON" | jq -r '.assets[] | "Asset: " + .name + " (" + (.size|tostring) + " bytes; " + .digest + ")"'
